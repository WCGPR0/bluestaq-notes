spring:
  application:
    name: notes-api
  # NOTE: Spring Boot 4 split Mongo support into spring-boot-mongodb (canonical
  # prefix spring.mongodb.*) and spring-boot-data-mongodb. The old
  # spring.data.mongodb.uri is silently ignored, leaving the driver on its
  # localhost:27017 default.
  mongodb:
    uri: ${MONGODB_URI}

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}

server:
  port: ${PORT:8080}
