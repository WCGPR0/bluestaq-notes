name: CI

on:
  push:
    branches: ["**"]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Full history is needed so the badge-commit step can pull/rebase
          # and push back to the same branch.
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # mvn verify runs the full test suite (embedded MongoDB, no external services needed)
      # and enforces the JaCoCo 70% instruction-coverage gate.
      - name: Run tests with coverage
        run: mvn -B verify

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: target/site/jacoco
          if-no-files-found: warn

      - name: Generate JaCoCo coverage badge
        uses: cicirello/jacoco-badge-generator@v2
        with:
          jacoco-csv-file: target/site/jacoco/jacoco.csv
          badges-directory: .github/badges

      # Commit the badge back to the same branch that triggered the run.
      # The old `github.ref == 'refs/heads/main'` guard never matched — this
      # repo has no `main` branch (default is `spring`) — so the badge was
      # generated but never committed, leaving .github/badges/jacoco.svg 404.
      # Guard on the bot actor (plus [skip ci]) to avoid a push loop.
      - name: Commit updated coverage badge
        if: github.actor != 'github-actions[bot]'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/badges
          git diff --staged --quiet || git commit -m "chore: update coverage badge [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
